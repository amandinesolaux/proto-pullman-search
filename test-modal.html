<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Discovery Modal</title>
  <link rel="stylesheet" href="core/styles/discovery-modal.css"/>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
    }
    .test-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 32px;
      background: #445047;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .test-card {
      width: 220px;
      height: 300px;
      background-image: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=800&h=450&fit=crop&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 16px;
      margin: 20px;
    }
  </style>
  <script src="core/components/components.js"></script>
</head>
<body>

  <button class="test-btn" onclick="document.querySelector('wd-discovery-modal').open()">
    Ouvrir Discovery Modal
  </button>

  <div style="padding: 40px;">
    <h2>Test card avec image Unsplash :</h2>
    <div class="test-card"></div>
  </div>

  <wd-discovery-modal></wd-discovery-modal>

</body>
</html>
