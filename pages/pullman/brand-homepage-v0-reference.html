<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pullman Hotels & Resorts</title>
  <link rel="stylesheet" href="../../core/tokens/brands.css?v=383"/>
  <link rel="stylesheet" href="../../core/styles/base.css?v=383"/>
  <link rel="stylesheet" href="../../brands/pullman/pullman.css"/>
  <script src="../../core/data/restaurants.js?v=383"></script>
  <script src="../../core/data/reunions.js?v=383"></script>
  <script src="../../core/components/components.js?v=383"></script>
  <script src="../../brands/pullman/pullman.js"></script>
</head>
<body class="brand-pullman">

<!-- ===== HEADER ===== -->
<wd-header
  nav="Destinations|Expériences|Offres|À propos de Pullman|Fidélité|Magazine"
  dropdowns="Destinations|Expériences|À propos de Pullman|Magazine"
  lang="EN"
  currency="USD ($)"
></wd-header>

<!-- ===== HERO ===== -->
<wd-hero
  img="https://m.ahstatic.com/is/image/accorhotels/PullmanLifestyle1:16by9?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=1600&hei=900&qlt=80"
  title="Des séjours inspirants à travers le monde"
  subtitle="Là où les échanges prennent vie et les esprits se rencontrent."
  cta1="Découvrir nos hôtels"
  cta2="Nos offres"
></wd-hero>

<!-- ===== BOOKING ENGINE ===== -->
<wd-booking cta="Rechercher"></wd-booking>

<!-- ===== CONTENT ===== -->
<div class="wd-content" style="padding: 120px 64px; max-width: 1340px; margin: 0 auto; display: flex; flex-direction: column; gap: 120px;">

  <!-- Section 1 : Destinations (carrousel) -->
  <section>
    <wd-carousel title="Explorez le monde autrement" tabs="Asie|Europe|Amériques|Moyen-Orient|Pacifique|Afrique" showmap seeall="Découvrir nos destinations">
      <wd-dest-card img="https://m.ahstatic.com/is/image/accorhotels/aja_p_1029-36:9by16?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=480&hei=853&qlt=80" kicker="Asie" title="Singapour"></wd-dest-card>
      <wd-dest-card img="https://m.ahstatic.com/is/image/accorhotels/aja_p_2810-66:9by16?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=480&hei=853&qlt=80" kicker="Asie" title="Shanghai"></wd-dest-card>
      <wd-dest-card img="https://m.ahstatic.com/is/image/accorhotels/aja_p_6935-96:9by16?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=480&hei=853&qlt=80" kicker="Moyen-Orient" title="Dubaï"></wd-dest-card>
      <wd-dest-card img="https://m.ahstatic.com/is/image/accorhotels/GettyImages-1187421561:9by16?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=480&hei=853&qlt=80" kicker="Europe" title="Paris"></wd-dest-card>
      <wd-dest-card img="https://m.ahstatic.com/is/image/accorhotels/aja_p_0626-10:9by16?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=480&hei=853&qlt=80" kicker="Amériques" title="São Paulo"></wd-dest-card>
      <wd-dest-card img="https://m.ahstatic.com/is/image/accorhotels/aja_p_0795-31:9by16?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=480&hei=853&qlt=80" kicker="Pacifique" title="Sydney"></wd-dest-card>
      <wd-dest-card img="https://m.ahstatic.com/is/image/accorhotels/aja_p_7014-44:9by16?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=480&hei=853&qlt=80" kicker="Europe" title="Toulouse"></wd-dest-card>
    </wd-carousel>
  </section>

  <!-- Section 2 : Voir l'ordinaire différemment -->
  <section>
    <wd-section-heading
      title="Voir l'ordinaire différemment"
      desc="Depuis plus de 150 ans, nous réinventons l'hospitalité avec un esprit pionnier et une curiosité sans limites."
      link="true"
      link-label="En savoir plus"
    ></wd-section-heading>

    <wd-editorial
      img="https://m.ahstatic.com/is/image/accorhotels/PullmanHeritageImage:6by5?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=800&hei=667&qlt=80"
      kicker="Notre héritage"
      title="Un héritage d'innovation"
      desc="L'innovation audacieuse, notre marque de fabrique. De l'exploit de déplacer un quartier entier à l'invention du pain de mie carré aux couchettes de luxe, Pullman façonne et inspire, aujourd'hui plus que jamais, l'avenir de l'hôtellerie mondiale."
      cta="Découvrir notre histoire"
      pager="1 / 3"
      caption="© Pullman Hotels & Resorts"
      white
    ></wd-editorial>
  </section>

  <!-- Section 3 : Nos offres du moment -->
  <section>
    <wd-section-heading
      title="Nos offres du moment"
      desc="Profitez de conditions avantageuses sur nos chambres, suites et services pour un séjour inoubliable, qu'il soit professionnel ou personnel."
      link="true"
      link-label="Toutes les offres"
    ></wd-section-heading>

    <wd-editorial
      img="https://m.ahstatic.com/is/image/accorhotels/pullman-dinner-2?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=800&qlt=80"
      kicker="Offre spéciale"
      title="Laissez place à l'imprévu"
      desc="Commencez la journée avec un petit-déjeuner généreux et healthy, puis profitez d'un dîner savoureux, pour que chaque repas soit un moment à apprécier et à partager."
      cta="Découvrir l'offre"
      caption="© Pullman Hotels & Resorts"
      image-left
      white
    ></wd-editorial>
  </section>

  <!-- Section 4 : Callout (Hôtels emblématiques) -->
  <section>
    <wd-callout-section
      title="Découvrez des espaces inspirants à travers le monde"
      desc="Avec plus de 155 hôtels dans le monde, Pullman ouvre les portes à de nouvelles idées. Découvrez nos hôtels les plus emblématiques, partez à la rencontre de ce qui vous anime."
      link="Laissez-vous guider"
    >
      <wd-callout-card
        img="https://m.ahstatic.com/is/image/accorhotels/aja_p_6409-72:16by9?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=600&hei=338&qlt=80"
        title="Pullman Paris Montparnasse"
        desc="Le Pullman Paris Montparnasse, flagship de la marque Pullman, est la destination incontournable de la capitale pour vos séjours affaires ou loisirs."
      ></wd-callout-card>
      <wd-callout-card
        img="https://m.ahstatic.com/is/image/accorhotels/aja_p_6783-26:16by9?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=600&hei=338&qlt=80"
        title="Pullman Lyon"
        desc="Face à la gare de la Part-Dieu et au pied de la tour To-Lyon, Le Pullman Lyon est le lieu stratégique pour vos séjours et événements."
      ></wd-callout-card>
      <wd-callout-card
        img="https://m.ahstatic.com/is/image/accorhotels/6556-1:16by9?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=600&hei=338&qlt=80"
        title="Pullman Bali Legian Beach"
        desc="A seulement 20 minutes de l'aéroport international Ngurah Rai, le Pullman Bali Legian Beach vous promet un paradis pur et le charme de la vie insulaire."
      ></wd-callout-card>
      <wd-callout-card
        img="https://m.ahstatic.com/is/image/accorhotels/HCM_P_4528724:16by9?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=600&hei=338&qlt=80"
        title="Pullman Budapest"
        desc="Situé au coeur du centre-ville, à seulement deux minutes à pied de l'Opéra national hongrois, le 5 étoiles Pullman Budapest offre un confort moderne."
      ></wd-callout-card>
    </wd-callout-section>
  </section>

  <!-- Section 5 : Expériences (Marketing) -->
  <wd-marketing
    title="Des espaces conçus pour inspirer et se rencontrer"
    desc="Réunion, détente, rencontres, bien-être : chez Pullman, chaque moment stimule vos idées et votre inspiration."
    link="true"
    link-label="Toutes les expériences"
    tabs="Réunions|Co-working|Restaurants & Bars|Pullman xChange"
    img="https://m.ahstatic.com/is/image/accorhotels/PullmanEvent:9by16?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=800&hei=1422&qlt=80"
    kicker="Réunions et événements"
    card-title="Réunions et événements"
    card-desc="Co-créez et échangez dans nos espaces modulables, conçus pour s'adapter à chaque projet. Des expériences immersives aux discussions autour d'un café, nous créons des moments d'exception."
    cta="En savoir plus"
    caption="© Pullman Hotels & Resorts"
  ></wd-marketing>

  <!-- Section 6 : Magazine (Highlight V2) -->
  <wd-highlight-v2
    img="https://m.ahstatic.com/is/image/accorhotels/aja_p_7258-60?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=500&qlt=80"
    kicker="Magazine"
    title="Magazine Pullman"
    desc="Des nouvelles idées aux perspectives culturelles, voici ce qui nous occupe, nous inspire et nous passionne en ce moment. Nouvelle expression. Nouveaux horizons."
    cta1="Découvrir ici"
    cta2="Voir les articles"
    caption="© Pullman Hotels & Resorts"
  ></wd-highlight-v2>

  <!-- Section 7 : Hôtellerie responsable (Billboard) -->
  <wd-billboard
    kicker="Développement durable"
    title="Hôtellerie responsable"
    desc="Chez Pullman, le développement durable n'est pas une finalité, mais un cheminement que nous abordons avec passion et conviction. Nos pratiques ont un impact positif sur l'environnement et la culture."
    img="https://m.ahstatic.com/is/image/accorhotels/aja_p_7258-57:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=600&hei=600&qlt=80"
  ></wd-billboard>

  <!-- Section 8 : Social Media -->
  <wd-social
    title="#Pullman"
    post="How about enjoying a tropical meal and some healthy mocktails by the pool of @moku_cairns, @novotelcairns restaurant? 🍹 #NovotelHotels #YourTimeYourWay #travelinaustralia #hotelbar"
  >
    <img src="https://m.ahstatic.com/is/image/accorhotels/aja_p_1029-36:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=400&hei=400&qlt=80" alt="Pullman Singapour" loading="lazy"/>
    <img src="https://m.ahstatic.com/is/image/accorhotels/aja_p_6409-72:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=400&hei=400&qlt=80" alt="Pullman Paris" loading="lazy"/>
    <img src="https://m.ahstatic.com/is/image/accorhotels/6556-1:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=400&hei=400&qlt=80" alt="Pullman Bali" loading="lazy"/>
    <img src="https://m.ahstatic.com/is/image/accorhotels/aja_p_6935-96:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=400&hei=400&qlt=80" alt="Pullman Dubaï" loading="lazy"/>
    <img src="https://m.ahstatic.com/is/image/accorhotels/Pullman-bar:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=400&hei=400&qlt=80" alt="Pullman Restaurant" loading="lazy"/>
    <img src="https://m.ahstatic.com/is/image/accorhotels/aja_p_0795-31:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=400&hei=400&qlt=80" alt="Pullman Sydney" loading="lazy"/>
    <img src="https://m.ahstatic.com/is/image/accorhotels/HCM_P_4528724:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=400&hei=400&qlt=80" alt="Pullman Budapest" loading="lazy"/>
  </wd-social>

  <!-- Section 9 : Loyalty Billboard -->
  <wd-loyalty
    title="Jusqu'à 10 % de réduction pour les membres ALL"
    benefits="Profitez de séjours à prix réduit|Obtenez facilement des récompenses|Accueil prioritaire et hospitalité VIP"
    cta1="Inscrivez-vous gratuitement"
    cta2="En savoir plus"
    img="https://m.ahstatic.com/is/image/accorhotels/aja_p_0795-31:16by9?fmt=jpg&op_usm=1.75,0.3,2,0&resMode=sharp2&iccEmbed=true&icc=sRGB&dpr=on,1.5&wid=800&hei=450&qlt=80"
    caption="© Pullman Hotels & Resorts"
  ></wd-loyalty>

</div>
