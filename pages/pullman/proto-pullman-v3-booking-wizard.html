.continent-card.is-active {

  top: 24px;
  right: 24px;
  width: 44px;
  height: 44px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  background: rgba(26,34,32,0.95);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;

.map-modal__content {

}

#wd-booking-map {

}

/* ===== CTA wizard — bordure « IA » shimmer légère, aligné sur le bas des cartes destination ===== */
.wd-booking__dd-body {
  position: relative;
  /* Empilement au-dessus des cartes, pour caler le CTA sans nombre magique :
     padding du panneau + hauteur du titre « DESTINATION » + sa marge basse */
  --wd-cards-top: calc(20px + 17px + 12px);
  --wd-card-size: 72px;   /* .wd-booking__dd-continent */
}
@property --wd-ai-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
.wd-booking__wizard-cta {
  position: absolute;
  /* bas du CTA = bas des cartes, quelle que soit sa hauteur */
  top: calc(var(--wd-cards-top) + var(--wd-card-size));
  transform: translateY(-100%);
  right: 48px;
  z-index: 6;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  /* mêmes métriques que le CTA « Rechercher » (.wd-booking__cta) pour une taille identique */
  height: 42px;
  box-sizing: border-box;
  padding: 0 24px;
  border: none;
  border-radius: 99px;
  background: transparent;
  color: #FFFFFF;
  font-family: 'Noto Sans', var(--font-sans);
  font-size: 16px;
  font-weight: 500;
  line-height: 24px;
  cursor: pointer;
  isolation: isolate;
  transition: background 0.2s ease;
}
/* Le CTA « Rechercher » adopte la même hauteur que le CTA wizard (42px) */
body.brand-pullman .wd-booking__cta { height: 42px; padding: 0 24px; }

/* Barre stable : dates & voyageurs à la taille de leur contenu, le champ de recherche prend
   tout l'espace restant -> largeur large et constante, plus de « saut » quand on ajoute des chips */
body.brand-pullman .wd-booking__field--dates,
body.brand-pullman .wd-booking__field--guests { flex: 0 0 auto; }

/* Croix + toggle carte alignés en bas, au niveau de la rangée de chips (et non centrés sur le label) */
body.brand-pullman .wd-booking__dest-clear,
body.brand-pullman .wd-booking__field--dest .wd-booking__map-toggle { align-self: flex-end; }

/* Chips de recherche : nom d'hôtel affiché en entier, sans troncature */
body.brand-pullman .wd-booking__dest-chip { max-width: none; flex-shrink: 0; }
/* La barre de recherche reste sur UNE ligne : l'input se comprime au lieu de passer à la ligne */
body.brand-pullman .wd-booking__dest-input-row { flex-wrap: nowrap; overflow: hidden; }
body.brand-pullman .wd-booking__dest-input { min-width: 30px; }

/* Sur mobile, l'inverse. La barre desktop tient sur une ligne parce qu'elle en a la
   largeur ; à 390 px, une seule puce « Pullman Cannes Mandelieu » la remplit, et la
   deuxième était coupée par l'overflow — on ne pouvait plus ni la lire ni la retirer.
   Le champ est empilé ici, donc il peut grandir : les puces passent à la ligne, et
   celle qui dépasserait encore se tronque au lieu de sortir du cadre. */
@media (max-width: 767px) {
  body.brand-pullman .wd-booking__dest-input-row { flex-wrap: wrap; overflow: visible; }
  body.brand-pullman .wd-booking__dest-chip { max-width: 100%; flex-shrink: 1; }
  /* Le champ de saisie garde de quoi taper, et prend sa propre ligne quand il n'y
     tient plus : une zone de frappe de 30 px coincée après deux puces est inutilisable. */
  body.brand-pullman .wd-booking__dest-input { min-width: 9rem; flex: 1 1 9rem; }
}

/* État intermédiaire : le titre « Reprendre votre recherche » s'aligne sur la gouttière (comme DESTINATION) */
wd-booking[data-disclosure="intermediate"] .wd-booking__dd-dest-subtitle { padding-left: 0; }

/* Compteur de résultats : fond uni (même couleur que le dropdown), jamais de dégradé */
body.brand-pullman .wd-booking__dd-results-bar { background: #1A2220; padding-top: 12px; }
body.brand-pullman .wd-booking__dd-results-bar--hint { background: none; padding: 0; margin-top: 18px; } /* aligné sur la gouttière + respiration au-dessus du divider */

@media (max-width: 600px) {
  .wd-booking__dd-body { --wd-card-size: 60px; } /* cartes réduites au même breakpoint */
}
/* Sous ~820px le CTA viendrait chevaucher la dernière carte : on le remonte au-dessus de la rangée */
@media (max-width: 820px) {
  .wd-booking__wizard-cta { top: 14px; transform: none; }
}

/* Sur mobile, ce CTA était calé en absolu sur la rangée de cartes du desktop : il
   flottait au-dessus du panneau, sans rapport avec ce qu'on lisait. Il reprend sa place
   dans le fil, sous les destinations, et occupe la largeur comme les autres actions. */
@media (max-width: 767px) {
  .wd-booking__wizard-cta { position: relative; transform: none; right: auto; top: auto;
    display: flex; width: 100%; justify-content: center; margin: 16px 0 4px;
    min-height: 48px; }
  wd-booking[data-disclosure="full"] .wd-booking__wizard-cta { display: flex; }

  /* En plein écran, le CTA rejoint « Rechercher » au bas de la fenêtre : les deux
     propositions — chercher soi-même ou se laisser guider — se lisent alors ensemble,
     au lieu que la seconde attende en fin de liste qu'on l'ait dépassée.
     76 px = 12 (bas) + 48 (hauteur du bouton) + 16 d'écart demandé. Fond plein, sinon
     la liste défilerait derrière un bouton translucide. */
  /* dd-body repasse en static : c'est lui qui sert de repère par défaut, et le bouton
     se calait alors 76 px au-dessus du bas de la liste, pas de la fenêtre. Il est le
     seul élément à s'y ancrer, rien d'autre ne bouge. */
  wd-booking[data-plein-ecran] .wd-booking__dd-body { position: static; }
  wd-booking[data-plein-ecran] .wd-booking__wizard-cta {
    position: absolute; left: 14px; right: 14px; bottom: 76px; top: auto;
    width: auto; margin: 0; z-index: 1050; background: #1a2220; }
  wd-booking[data-plein-ecran] .wd-booking__wizard-cta:hover { background: #232e2a; }
  /* La zone de défilement s'arrête au-dessus des deux boutons : 12 + 48 + 16 + 48 + 16. */
  wd-booking[data-plein-ecran] .wd-booking__dropdown { padding-bottom: 140px; }
  /* En vue carte, la carte occupe tout : le CTA y est masqué, rien à réserver. */
  wd-booking[data-plein-ecran][data-vue-carte] .wd-booking__dropdown { padding-bottom: 0; }
}
/* Vue complète (continent choisi) : le CTA wizard se retire — re-cliquer le continent le fait revenir */
wd-booking[data-disclosure="full"] .wd-booking__wizard-cta { display: none; }
.wd-booking__wizard-cta::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  /* contour blanc constant + arc lumineux qui tourne */
  background: conic-gradient(from var(--wd-ai-angle),
    rgba(255,255,255,.5) 0deg,
    rgba(255,255,255,1) 30deg,
    rgba(255,255,255,.5) 85deg,
    rgba(255,255,255,.5) 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  animation: wd-ai-spin 4.5s linear infinite;
  pointer-events: none;
  z-index: -1;
}
@keyframes wd-ai-spin { to { --wd-ai-angle: 360deg; } }
.wd-booking__wizard-cta:hover { background: rgba(255, 255, 255, 0.08); }
.wd-booking__wizard-cta:hover::before { animation-duration: 2.5s; }
.wd-booking__wizard-cta:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 2px; }
.wd-booking__wizard-cta-icon { display: inline-flex; color: #FFFFFF; }
@media (prefers-reduced-motion: reduce) {
  .wd-booking__wizard-cta::before { animation: none; }
}

/* ===== Divulgation progressive : la colonne Critères se révèle au clic sur un continent ===== */
wd-booking[data-disclosure="intermediate"] .wd-booking__dd-criteria-col {
  display: none;
}
wd-booking[data-disclosure="intermediate"] .wd-booking__dd-dest-col {
  border-right-color: transparent;
  flex: 1;
  min-height: 0; /* pas de vide sous le compteur : la colonne s'ajuste à son contenu */
}
wd-booking[data-disclosure="full"] .wd-booking__dd-criteria-col {
  max-width: none;
  opacity: 1;
  transition: none;
  animation: wd-reveal-col 0.32s ease-out both;
}
@keyframes wd-reveal-col {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  wd-booking[data-disclosure="full"] .wd-booking__dd-criteria-col { animation: none; }
}

/* ===== Alignement à gauche sur la gouttière 48px (comme bannière / destinations) =====
   On aligne le bloc du champ (et non le glyphe) à 48 : l'icône garde son retrait interne,
   ce qui la fait tomber pile sous la tuile ✨ de la bannière. */
body.brand-pullman .wd-booking__tabs { padding-left: 0; }
body.brand-pullman .wd-booking__fields { padding-left: 0; }

/* Sur mobile il n'y a plus de gouttière de 48 px à rejoindre : .wd-booking perd sa
   marge, et ces deux zéros collaient les onglets et le champ au bord de l'écran
   pendant que le contenu du panneau — Filtres, DESTINATION, les vignettes — restait
   à 14. Trois alignements différents sur la même colonne. On reprend le 14 du panneau. */
@media (max-width: 767px) {
  body.brand-pullman .wd-booking__tabs,
  body.brand-pullman .wd-booking__fields { padding-left: 14px; }
}

/* Le fond #1a2220 du calendrier (et du panneau voyageurs) est désormais porté par base.css,
   avec celui du dropdown : la surcharge qui vivait ici n'a plus lieu d'être. */

/* ===== Masquer le placeholder du champ quand des critères (chips) sont présents — toutes tabs ===== */
body.brand-pullman .wd-booking__dest-chips:not(:empty) + .wd-booking__dest-input::placeholder {
  color: transparent;
}
</style>

<script>
function openMapModal() {
  const modal = document.getElementById('mapModal');
  modal.style.display = 'flex';
  initBookingMap('ameriques');
  renderCountryList('ameriques');
  setTimeout(() => refreshBookingMapSize(), 100);
}

function closeMapModal() {
  document.getElementById('mapModal').style.display = 'none';
}

// Ouvrir au clic sur "Show map"
document.addEventListener('click', (e) => {
  if (e.target.closest('.wd-carousel__map')) {
    e.preventDefault();
    openMapModal();
  }
});

// Gestion des continents
document.addEventListener('click', (e) => {
  const card = e.target.closest('.continent-card');
  if (card) {
    const continent = card.dataset.continent;
    document.querySelectorAll('.continent-card').forEach(c => c.classList.remove('is-active'));
    card.classList.add('is-active');
    updateBookingMapContinent(continent);
    renderCountryList(continent);
  }
});

// Gestion des critères
document.addEventListener('change', (e) => {
  if (e.target.dataset.amenity) {
    const criteria = new Set();
    document.querySelectorAll('[data-amenity]:checked').forEach(cb => {
      criteria.add(cb.dataset.amenity);
    });
    updateBookingMapCriteria(criteria);
  }
});

// Fermer avec Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMapModal();
});
</script>

<!-- ===== V3 : point d'entrée du Discovery Wizard DANS le dropdown du booking engine (Option A) ===== -->
<script>
(function () {
  const CTA_HTML =
    '<span class="wd-booking__wizard-cta-icon" aria-hidden="true">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M12 3l1.8 4.5L18.5 9.3l-4.7 1.8L12 15.6l-1.8-4.5L5.5 9.3l4.7-1.8L12 3z"/>' +
        '<path d="M18.5 14.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z"/>' +
      '</svg>' +
    '</span>' +
    '<span>Laissez-vous guider</span>';

  function openWizard() {
    // Ferme le dropdown du booking engine
    const dropdown = document.querySelector('.wd-booking__dropdown');
    if (dropdown) dropdown.dataset.state = 'closed';
    const destField = document.querySelector('.wd-booking__field--dest');
    if (destField) destField.classList.remove('wd-booking__field--editing');
    // Ouvre le Discovery Wizard
    const modal = document.querySelector('wd-discovery-modal');
    if (modal && typeof modal.open === 'function') {
      modal.open();
    } else {
      console.warn('[V3] wd-discovery-modal introuvable ou sans méthode open()');
    }
  }

  function initWizardEntry(retries) {
    const ddBody = document.querySelector('.wd-booking__dd-body');
    if (!ddBody) {
      if (retries > 0) setTimeout(() => initWizardEntry(retries - 1), 150);
      return;
    }
    if (ddBody.querySelector('.wd-booking__wizard-cta')) return; // déjà injecté

    const cta = document.createElement('button');
    cta.type = 'button';
    cta.className = 'wd-booking__wizard-cta';
    cta.setAttribute('aria-label', 'Laissez-vous guider vers l\'inspiration Pullman');
    cta.innerHTML = CTA_HTML;
    cta.addEventListener('click', openWizard);
    ddBody.appendChild(cta); // état intermédiaire : en haut à droite, aligné sur les cartes (masqué en vue complète via CSS)
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => initWizardEntry(25));
  } else {
    initWizardEntry(25);
  }
})();
</script>
