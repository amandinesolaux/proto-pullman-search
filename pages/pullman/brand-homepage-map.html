<script>
(function() {
  const HOTELS = [
    { name: "Pullman Paris Montparnasse", loc: "Paris, France", lat: 48.8422, lng: 2.3219, stars: 4, price: 189, region: "europe", img: "https://m.ahstatic.com/is/image/accorhotels/aja_p_6409-72:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Paris Tour Eiffel", loc: "Paris, France", lat: 48.8559, lng: 2.2930, stars: 5, price: 259, region: "europe", img: "https://m.ahstatic.com/is/image/accorhotels/aja_p_6783-26:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Paris Bercy", loc: "Paris, France", lat: 48.8396, lng: 2.3826, stars: 4, price: 175, region: "europe", img: "https://m.ahstatic.com/is/image/accorhotels/aja_p_7258-60:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Lyon Part-Dieu", loc: "Lyon, France", lat: 45.7602, lng: 4.8590, stars: 4, price: 159, region: "europe", img: "https://m.ahstatic.com/is/image/accorhotels/aja_p_6935-96:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Lyon Centre", loc: "Lyon, France", lat: 45.7640, lng: 4.8357, stars: 4, price: 169, region: "europe", img: "https://m.ahstatic.com/is/image/accorhotels/Pullman-bar:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Marseille Provence", loc: "Marseille, France", lat: 43.4370, lng: 5.2148, stars: 4, price: 145, region: "europe", img: "https://m.ahstatic.com/is/image/accorhotels/aja_p_1029-36:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Marrakech Palmeraie", loc: "Marrakech, Maroc", lat: 31.6690, lng: -7.9811, stars: 5, price: 179, region: "moyen-orient", img: "https://m.ahstatic.com/is/image/accorhotels/aja_p_0795-31:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman London St Pancras", loc: "Londres, Royaume-Uni", lat: 51.5305, lng: -0.1240, stars: 5, price: 289, region: "europe", img: "https://m.ahstatic.com/is/image/accorhotels/PullmanHeritageImage:6by5?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Barcelona Skipper", loc: "Barcelone, Espagne", lat: 41.3851, lng: 2.1994, stars: 5, price: 219, region: "europe", img: "https://m.ahstatic.com/is/image/accorhotels/pullman-dinner-2:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Dubai Creek City Centre", loc: "Dubaï, EAU", lat: 25.2532, lng: 55.3320, stars: 5, price: 199, region: "moyen-orient", img: "https://m.ahstatic.com/is/image/accorhotels/6556-1:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Singapore Orchard", loc: "Singapour", lat: 1.3048, lng: 103.8318, stars: 5, price: 229, region: "asie", img: "https://m.ahstatic.com/is/image/accorhotels/HCM_P_4528724:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Nice Côte d'Azur", loc: "Nice, France", lat: 43.6653, lng: 7.2150, stars: 4, price: 185, region: "europe", img: "https://m.ahstatic.com/is/image/accorhotels/aja_p_6409-72:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Bordeaux Lac", loc: "Bordeaux, France", lat: 44.8799, lng: -0.5640, stars: 4, price: 155, region: "europe", img: "https://m.ahstatic.com/is/image/accorhotels/aja_p_6783-26:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Bangkok Hotel G", loc: "Bangkok, Thaïlande", lat: 13.7248, lng: 100.5170, stars: 5, price: 139, region: "asie", img: "https://m.ahstatic.com/is/image/accorhotels/aja_p_7258-60:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Bali Legian Beach", loc: "Bali, Indonésie", lat: -8.7055, lng: 115.1700, stars: 5, price: 159, region: "asie", img: "https://m.ahstatic.com/is/image/accorhotels/aja_p_6935-96:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
    { name: "Pullman Tokyo Tamachi", loc: "Tokyo, Japon", lat: 35.6453, lng: 139.7479, stars: 5, price: 249, region: "asie", img: "https://m.ahstatic.com/is/image/accorhotels/PullmanEvent:1by1?fmt=jpg&op_usm=1.75,0.3,2,0&wid=300&hei=200" },
  ];

  const map = L.map('world-map', { zoomControl: false, scrollWheelZoom: false }).setView([25, 20], 2);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM &amp; CartoDB',
    maxZoom: 18
  }).addTo(map);

  let markers = [];

  function renderMarkers(region) {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    const filtered = region === 'all' ? HOTELS : HOTELS.filter(h => h.region === region);
    filtered.forEach(h => {
      const icon = L.divIcon({
        className: '',
        html: '<div class="wd-marker" style="width:24px;height:24px;font-size:0"></div>',
        iconSize: [24, 24],
        iconAnchor: [12, 12],
        popupAnchor: [0, -16]
      });
      const m = L.marker([h.lat, h.lng], { icon }).addTo(map);
      m.bindPopup(`<div class="wd-popup">
        <img src="${h.img}" alt="${h.name}"/>
        <div class="wd-popup-body">
          <span class="wd-popup-name">${h.name}</span>
          <span class="wd-popup-loc">${h.loc}</span>
          <span class="wd-popup-price">À partir de ${h.price} €/nuit</span>
        </div>
      </div>`, { closeButton: false, maxWidth: 220, minWidth: 220 });
      markers.push(m);
    });

    if (filtered.length > 1) {
      map.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
    } else if (filtered.length === 1) {
      map.setView([filtered[0].lat, filtered[0].lng], 6);
    }
  }

  renderMarkers('all');

  document.getElementById('wm-filters').addEventListener('click', e => {
    const btn = e.target.closest('.wd-world-map__filter');
    if (!btn) return;
    document.querySelectorAll('.wd-world-map__filter').forEach(b => b.classList.remove('wd-world-map__filter--active'));
    btn.classList.add('wd-world-map__filter--active');
    renderMarkers(btn.dataset.region);
  });

  document.querySelectorAll('a[href="#"]').forEach(a => a.addEventListener('click', e => e.preventDefault()));
})();
</script>
