    /* ── HEADER ── */
    .hd-header { background: var(--pul-olive, #445047); }
    .hd-header-inner { display: flex; align-items: center; justify-content: space-between; padding: 12px 40px; max-width: 1280px; margin: 0 auto; }

    .hd-logo svg { height: 22px; width: auto; }
    .hd-nav { display: flex; align-items: center; gap: 20px; }
    .hd-nav a { color: rgba(255,255,255,.7); font-size: 13px; text-decoration: none; transition: color .15s; }
    .hd-nav a:hover { color: #fff; }

    /* ── GALLERY ── */
    .hd-gallery { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; max-width: 1280px; margin: 0 auto; padding: 24px 40px 0; height: 420px; border-radius: 16px; overflow: hidden; }
    .hd-gallery-main { grid-row: 1 / 3; border-radius: 16px 0 0 16px; overflow: hidden; cursor: pointer; position: relative; }
    .hd-gallery-main img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
    .hd-gallery-main:hover img { transform: scale(1.03); }
    .hd-gallery-side { overflow: hidden; cursor: pointer; position: relative; }
    .hd-gallery-side:nth-child(3) { border-radius: 0 16px 0 0; }
    .hd-gallery-side:nth-child(4) { border-radius: 0 0 16px 0; }
    .hd-gallery-side img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
    .hd-gallery-side:hover img { transform: scale(1.05); }
    .hd-gallery-more { position: absolute; bottom: 14px; right: 14px; background: #fff; color: #222; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 8px; border: 1px solid #222; cursor: pointer; transition: background .15s; }
    .hd-gallery-more:hover { background: #f5f5f5; }

    /* ── CONTENT ── */
    .hd-content { max-width: 1280px; margin: 0 auto; padding: 32px 40px; display: grid; grid-template-columns: 1fr 380px; gap: 48px; }

    /* LEFT */
    .hd-main {}
    .hd-title { font-size: 28px; font-weight: 700; color: #222; margin-bottom: 4px; }
    .hd-subtitle { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #717171; margin-bottom: 20px; flex-wrap: wrap; }
    .hd-stars { color: var(--pul-olive, #445047); font-size: 13px; letter-spacing: 1px; }
    .hd-rating-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: #222; }
    .hd-rating-badge span { font-weight: 400; color: #717171; }
    .hd-divider { height: 1px; background: #ebebeb; margin: 24px 0; }

    .hd-section-title { font-size: 20px; font-weight: 700; color: #222; margin-bottom: 16px; }
    .hd-description { font-size: 15px; line-height: 1.7; color: #444; margin-bottom: 8px; }

    /* AMENITIES */
    .hd-amenities { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .hd-amenity { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #444; padding: 10px 0; }
    .hd-amenity-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .hd-amenity-icon svg { width: 20px; height: 20px; stroke: var(--pul-olive, #445047); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* MAP */
    .hd-map-wrap { margin-top: 8px; }
    .hd-map { width: 100%; height: 280px; border-radius: 12px; overflow: hidden; }

    /* RIGHT SIDEBAR */
    .hd-sidebar {}
    .hd-booking-card { position: sticky; top: 24px; background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .hd-booking-price { font-size: 22px; font-weight: 700; color: #222; margin-bottom: 4px; }
    .hd-booking-price span { font-size: 15px; font-weight: 400; color: #717171; }
    .hd-booking-dates { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #bbb; border-radius: 8px; overflow: hidden; margin: 16px 0 12px; }
    .hd-booking-date { padding: 10px 12px; border-right: 1px solid #bbb; }
    .hd-booking-date:last-child { border-right: none; }
    .hd-booking-date-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #222; }
    .hd-booking-date-value { font-size: 13px; color: #717171; margin-top: 2px; }
    .hd-booking-guests { padding: 10px 12px; border: 1px solid #bbb; border-top: none; border-radius: 0 0 8px 8px; }
    .hd-booking-guests-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #222; }
    .hd-booking-guests-value { font-size: 13px; color: #717171; margin-top: 2px; }
