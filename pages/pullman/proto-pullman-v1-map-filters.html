        </button>
        <button class="continent-card" data-continent="asie" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
          <span>ASIE</span>
        </button>
        <button class="continent-card" data-continent="moyen-orient" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
          <span>MOYEN-ORIENT</span>
        </button>
        <button class="continent-card" data-continent="oceanie" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
          <span>OCÉANIE</span>
        </button>
        <button class="continent-card is-active" data-continent="ameriques" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
          <span>AMÉRIQUES</span>
        </button>
        <button class="continent-card" data-continent="afrique" style="background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);">
          <span>AFRIQUE</span>
        </button>

    </div>

      <div id="country-list-container"></div>
    </div>

    <div class="map-modal__section">
      <h4 class="map-modal__title">CRITÈRES</h4>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <label style="display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.8); font-size: 14px; cursor: pointer;">
          <input type="checkbox" data-amenity="pool"> Piscine

        <label style="display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.8); font-size: 14px; cursor: pointer;">

<style>
.map-modal {
  position: fixed;
  inset: 0;
  background: #1a2220;
  z-index: 10000;
  display: flex;
}

.map-modal__sidebar {
  width: 360px;
  background: #1a2220;
  border-right: 1px solid rgba(255,255,255,0.1);
  overflow-y: auto;
  padding: 0;
}

.map-modal__header {
  padding: 32px 24px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.map-modal__section {
  padding: 24px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.map-modal__title {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,0.5);
  margin: 0 0 16px 0;
}

.map-modal__continents {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.continent-card {
  height: 90px;
  border: 2px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  padding: 14px;
}

.continent-card span {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  position: relative;
  z-index: 1;
  letter-spacing: 0.5px;
}

.continent-card:hover {
  border-color: rgba(95,239,145,0.5);
  transform: scale(1.03);
}

.continent-card.is-active {
  border-color: #5FEF91;
  box-shadow: 0 0 0 1px #5FEF91, 0 4px 12px rgba(95,239,145,0.3);
}

.map-modal__close {
  position: absolute;
  top: 24px;
  right: 24px;
  width: 44px;
  height: 44px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  background: rgba(26,34,32,0.95);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  z-index: 100;
}

.map-modal__close:hover {
  border-color: #5FEF91;
  background: #1a2220;
}

.map-modal__content {
  flex: 1;
  position: relative;
}

#wd-booking-map {
  width: 100%;
  height: 100%;
}
</style>

<script>
function openMapModal() {
  const modal = document.getElementById('mapModal');
  modal.style.display = 'flex';
  initBookingMap('ameriques');
  renderCountryList('ameriques');
  setTimeout(() => refreshBookingMapSize(), 100);
}

function closeMapModal() {
  document.getElementById('mapModal').style.display = 'none';
}

// Ouvrir au clic sur "Show map"
document.addEventListener('click', (e) => {
  if (e.target.closest('.wd-carousel__map')) {
    e.preventDefault();
    openMapModal();
  }
});

// Gestion des continents
document.addEventListener('click', (e) => {
  const card = e.target.closest('.continent-card');
  if (card) {
    const continent = card.dataset.continent;
    document.querySelectorAll('.continent-card').forEach(c => c.classList.remove('is-active'));
    card.classList.add('is-active');
    updateBookingMapContinent(continent);
    renderCountryList(continent);
  }
});

// Gestion des critères
document.addEventListener('change', (e) => {
  if (e.target.dataset.amenity) {
    const criteria = new Set();
    document.querySelectorAll('[data-amenity]:checked').forEach(cb => {
      criteria.add(cb.dataset.amenity);
    });
    updateBookingMapCriteria(criteria);
  }
});

// Fermer avec Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMapModal();
});
</script>
