<style>
/* ===== Page résultats — même langage que le booking V3 (sombre, Neue Power, sans radius) ===== */
/* Pas de hero ici : on annule la marge négative du booking (prévue pour chevaucher le hero) */
wd-booking { margin-top: 20px; }

/* --- En-tête compact « résultats » : logo + liens, plus léger que le header d'accueil --- */
.srx-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  max-width: 1320px;
  margin: 0 auto;
  padding: 18px 48px 16px;
  border-bottom: 1px solid rgba(255,255,255,.09);
}
.srx-logo { display: block; flex-shrink: 0; }
.srx-logo svg { width: 104px; height: auto; display: block; }
.srx-topbar-links { display: flex; align-items: center; gap: 26px; }
.srx-topbar-links a {
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--pul-muted, #D9E6D0);
  text-decoration: none;
  transition: color .15s;
}
.srx-topbar-links a:hover { color: #fff; }
.srx-topbar-account {
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 100px;
  padding: 8px 18px;
  color: #fff !important;
}
.srx-topbar-account:hover { border-color: rgba(255,255,255,.55); }

/* --- Fil d'Ariane : on est sur une page de résultats --- */
.srx-crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-sans);
  font-size: 12px;
  letter-spacing: .3px;
  margin-bottom: 12px;
}
.srx-crumb a { color: var(--pul-muted, #D9E6D0); text-decoration: none; }
.srx-crumb a:hover { color: #fff; text-decoration: underline; text-underline-offset: 2px; }
.srx-crumb span[aria-hidden] { color: rgba(255,255,255,.3); }
.srx-crumb-current { color: #fff; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; font-size: 11px; }

@media (max-width: 760px) {
  .srx-topbar { padding: 14px 20px; gap: 16px; }
  .srx-topbar-links { gap: 14px; }
  .srx-topbar-links a:not(.srx-topbar-account) { display: none; }
}

.srx {
  max-width: 1320px;
  margin: 40px auto 120px;
  padding: 0 48px;
  display: grid;
  grid-template-columns: minmax(0, 0.85fr) minmax(440px, 1.15fr);
  gap: 16px 28px;
  align-items: start;
}
.srx-head { grid-column: 1 / -1; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 8px; }
.srx-title { font-family: var(--font-serif); font-weight: 800; font-size: 32px; line-height: 1.05; text-transform: uppercase; color: #fff; margin: 0 0 8px; }
.srx-title strong { color: var(--pul-highlight, #5FEF91); }
.srx-sub { font-family: var(--font-sans); font-size: 14px; color: var(--pul-muted, #D9E6D0); margin: 0; }
.srx-sort { display: flex; align-items: center; gap: 10px; font-family: var(--font-sans); font-size: 13px; color: var(--pul-muted, #D9E6D0); white-space: nowrap; }
.srx-sort select { background: #28332B; color: #fff; border: 1px solid rgba(255,255,255,.15); border-radius: 0; padding: 9px 12px; font-family: var(--font-sans); font-size: 13px; cursor: pointer; }

/* --- Cards --- */
.srx-list { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
/* Cards claires : les mêmes couleurs que l'encart de la carte, prises sur les tokens
   « surface claire » (#445047 pour le texte, #BCCABE pour les filets). Pas de bordure —
   sur le fond sombre de la page, une card blanche se détache d'elle-même. */
.srx-card { display: flex; gap: 14px; background: #fff; border: none; border-radius: 0; padding: 12px; transition: box-shadow .15s, transform .15s; cursor: pointer; }
.srx-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.28); }
.srx-card:focus-visible { outline: 2px solid var(--pul-highlight, #5FEF91); outline-offset: 2px; }
/* Card sélectionnée : liseré vert à gauche, pour la retrouver d'un coup d'œil dans la
   liste après avoir cliqué son pin. Discret — la carte reste le point d'attention. */
.srx-card--active { box-shadow: inset 4px 0 0 var(--pul-highlight, #5FEF91), 0 6px 20px rgba(0,0,0,.28); }
/* Colonne visuelle : c'est le conteneur qui prend la hauteur de la card, et l'image y est
   en position absolue. Sans ce conteneur, un <img> en élément flex impose sa hauteur
   intrinsèque — une photo portrait étirait sa card à 240px quand les autres en font 150. */
.srx-card-media { flex: 0 0 160px; width: 160px; align-self: stretch; position: relative; overflow: hidden; background: #E7EDE8; min-height: 120px; }
/* Les photos se superposent, une seule visible : la card ne change pas de hauteur d'une
   photo à l'autre. */
.srx-card-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .25s; }
.srx-card-img[data-on] { opacity: 1; }
/* Bande de 160px : les chevrons de la card de la carte y prendraient 42% de la largeur. */
.srx-card-media .pullman-popup__nav { width: 24px; }
.srx-card-media:hover .pullman-popup__nav { opacity: 1; }
.srx-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.srx-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.srx-card-name { font-family: var(--font-sans); font-weight: 700; font-size: 16.5px; color: #445047; margin: 0 0 3px; }
.srx-card-loc { font-family: var(--font-sans); font-size: 13px; color: rgba(68,80,71,.78); margin: 0 0 10px; }
.srx-card-rating { flex-shrink: 0; text-align: right; font-family: var(--font-sans); }
.srx-card-rating b { display: inline-block; background: var(--pul-bg, #445047); color: #fff; font-size: 13px; font-weight: 700; padding: 5px 8px; }
.srx-card-rating span { display: block; font-size: 11px; color: rgba(68,80,71,.78); margin-top: 4px; }
/* Badges : services distinctifs de l'hôtel, pas les critères filtrés. Sans coche —
   ils n'affirment plus « ce critère est satisfait » mais « voici ce qu'il a en propre ». */
/* Une seule ligne, hauteur réservée : sans cela les cards oscillaient entre 144 et
   175px selon que les badges passaient à la ligne, et la liste devenait irrégulière.
   20% des hôtels n'ont aucun service distinctif — leur card garde la même hauteur. */
.srx-badges { display: flex; flex-wrap: nowrap; overflow: hidden; gap: 6px; margin: 0 0 10px; min-height: 21px; }
.srx-badge { flex-shrink: 0; }
.srx-badge { font-family: var(--font-sans); font-size: 11.5px; font-weight: 500; color: #2F4034; background: rgba(95,239,145,.24); border: none; padding: 3px 9px; display: inline-flex; align-items: center; }
.srx-card-bottom { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.srx-price { font-family: var(--font-sans); color: #445047; }
.srx-price b { font-size: 19px; font-weight: 700; }
.srx-price span { font-size: 12px; color: rgba(68,80,71,.78); }
/* Deux actions : consulter la fiche (lien discret) et réserver (bouton).
   La hiérarchie dit laquelle est l'action principale. */
/* Paire d'actions du design system Accor : bouton contour puis lien fléché.
   Pas de vert plein ici — sur une liste de 110 cards, autant de pastilles vertes
   saturaient la page ; le contour tient l'affordance sans crier. */
.srx-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-shrink: 0; }
.srx-cta { display: inline-flex; align-items: center; justify-content: center; padding: 9px 20px; border: 1px solid #445047; border-radius: 100px; background: transparent; font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: #445047; text-decoration: none; white-space: nowrap; transition: background .15s, color .15s; }
.srx-cta:hover { background: #445047; color: #fff; }
.srx-link { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-sans); font-size: 13px; color: #445047; text-decoration: none; white-space: nowrap; transition: gap .15s; }
.srx-link:hover { gap: 11px; }

/* --- Zéro résultat --- */
/* Bloc zéro-résultat : il occupe la place des cards, il suit donc la même surface claire */
.srx-empty { background: #fff; border: none; padding: 20px; font-family: var(--font-sans); }
.srx-empty h2 { font-family: var(--font-serif); font-weight: 800; font-size: 16px; text-transform: uppercase; color: #445047; margin: 0 0 8px; }
.srx-empty p { font-size: 13.5px; line-height: 1.5; color: rgba(68,80,71,.78); margin: 0 0 14px; }
.srx-empty p strong { color: #445047; }
.srx-empty-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.srx-empty-relax { font-family: var(--font-sans); font-size: 13px; font-weight: 600; padding: 10px 18px; border: none; border-radius: 100px; background: var(--pul-highlight, #5FEF91); color: var(--pul-bg, #445047); cursor: pointer; }
.srx-empty-relax:hover { background: var(--pul-highlight-hover, #4DD87A); }
.srx-empty-reset { font-family: var(--font-sans); font-size: 13px; color: #445047; background: none; border: none; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.srx-empty-reset:hover { color: #2F4034; }

/* --- Carte --- */
.srx-map-col { position: sticky; top: 24px; }
.srx-map { height: calc(100vh - 48px); min-height: 480px; border: 1px solid rgba(255,255,255,.1); background: #1A2220; }
.srx-map .leaflet-container { background: #1A2220; }
.srx-pin { width: 12px; height: 12px; background: var(--pul-highlight, #5FEF91); border-radius: 50%; border: 2px solid #1A2220; box-shadow: 0 0 6px rgba(95,239,145,.5); transition: all .2s; }
/* Pin sélectionné : sans bulle, c'est lui seul qui dit quel hôtel on regarde.
   Même marque que sur la carte du dropdown — point blanc cerclé de vert. */
.srx-pin-wrap--active .srx-pin { width: 16px; height: 16px; margin: -2px 0 0 -2px; background: #fff; border-color: var(--pul-highlight, #5FEF91); box-shadow: 0 0 0 4px rgba(95,239,145,.35), 0 2px 8px rgba(0,0,0,.5); }
.srx-pin-label { position: absolute; left: 16px; top: -3px; font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.9); white-space: nowrap; }
.leaflet-popup-content-wrapper { background: #28332B; color: #fff; border-radius: 0; font-family: var(--font-sans); }
.leaflet-popup-tip { background: #28332B; }

@media (max-width: 980px) {
  .srx { grid-template-columns: 1fr; }
  .srx-map-col { position: static; }
  .srx-map { height: 380px; min-height: 0; }
}
</style>

<script>
(function () {
  const P = new URLSearchParams(location.search);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };

  // Coordonnées approximatives par pays (repli quand l'hôtel n'est pas dans le jeu carte)
  // (COUNTRY_COORDS supprimé : les coordonnées viennent désormais de WD_SEARCH_DATA.hotels)

  function ready(retries) {
    if (!window.WD_SEARCH_DATA) { if (retries > 0) setTimeout(() => ready(retries - 1), 100); return; }
    // L'onglet vient de la barre de recherche : il décide de ce que cette page liste.
    if (P.get('tab') === 'restaurants') initRestaurants(window.WD_SEARCH_DATA);
    else init(window.WD_SEARCH_DATA);
  }

  // ══ Mode Restaurants ═══════════════════════════════════════════════════════════
  // La page liste des tables et non des hôtels. Même mise en page, mêmes conteneurs :
  // ce qui change est ce qu'on compte, ce qu'on montre dans les cards, et ce que la
  // carte situe — un lieu de restauration n'a pas d'adresse propre, il est à son hôtel.
  function initRestaurants(D) {
    const tous = window.WD_RESTAURANTS || [];
    const groupes = window.WD_RESTO_CRITERIA || [];
    const parNom = new Map(D.hotels.map(h => [h.name, h]));

    // ---- Périmètre : même sémantique que le panneau ----
    let lieux = tous.slice(), scopeLabel = '';
    const cont = P.get('continent');
    if (cont && cont !== 'all') {
      const r = D.regions.find(x => x.id === cont);
      lieux = lieux.filter(v => v.region === cont);
      scopeLabel = r ? r.label : '';
    } else if (cont === 'all') scopeLabel = 'Tous les continents';
    const country = P.get('country');
    if (country) { lieux = lieux.filter(v => v.pays === country); scopeLabel = country; }
    const city = P.get('city');
    if (city) { lieux = lieux.filter(v => v.ville === city); scopeLabel = city; }
    const hotelName = P.get('hotel');
    if (hotelName) { lieux = lieux.filter(v => v.hotel === hotelName); scopeLabel = hotelName; }
    const restoName = P.get('resto');
    if (restoName) { lieux = lieux.filter(v => v.nom === restoName); scopeLabel = restoName; }
    const q = (P.get('q') || '').trim();
    if (q) {
      const lq = q.toLowerCase();
      lieux = lieux.filter(v => (v.nom + ' ' + v.hotel + ' ' + v.ville).toLowerCase().includes(lq));
      if (!scopeLabel) scopeLabel = '« ' + q + ' »';
    }
    if (!scopeLabel) scopeLabel = 'Toutes nos destinations';

    // ---- Critères : ET entre les groupes, OU à l'intérieur, comme le panneau ----
    const critIds = (P.get('criteria') || '').split(',').filter(Boolean);
    const libelle = (id) => {
      for (const g of groupes) { const it = g.items.find(x => x.id === id); if (it) return it.label; }
      return id;
    };
    const repond = (v, ids) => groupes.every(g => {
      const coches = g.items.map(it => it.id).filter(id => ids.indexOf(id) >= 0);
      if (!coches.length) return true;
      return coches.some(id => id === v.type || v.cuisines.indexOf(id) >= 0 || v.tags.indexOf(id) >= 0);
    });
    const results = lieux.filter(v => repond(v, critIds));

    // ---- Le mot qui nomme ce qu'on compte ----
    const resto = critIds.indexOf('restaurant') >= 0, bar = critIds.indexOf('bar') >= 0;
    const mot = (n) => (resto && !bar) ? 'restaurant' + (n > 1 ? 's' : '')
      : (bar && !resto) ? 'bar' + (n > 1 ? 's' : '')
      : (n > 1 ? 'restaurants et bars' : 'restaurant ou bar');

    // ---- En-tête ----
    const fmtDay = (iso) => new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' }).format(new Date(iso + 'T12:00:00'));
    const sub = [];
    if (critIds.length) sub.push(critIds.map(libelle).join(', '));
    const arr = P.get('checkin'), dep = P.get('checkout');
    if (arr && dep) sub.push(fmtDay(arr) + ' – ' + fmtDay(dep));
    // Un couvert, pas une chambre : on ne parle pas d'occupation d'hôtel ici.
    const nAdultes = Math.max(1, parseInt(P.get('adults'), 10) || 1);
    const nEnfants = Math.max(0, parseInt(P.get('children'), 10) || 0);
    sub.push((nAdultes + nEnfants) + ' personne' + (nAdultes + nEnfants > 1 ? 's' : ''));
    document.getElementById('srx-title').innerHTML =
      '<strong>' + results.length + '</strong> ' + mot(results.length) + ' — ' + esc(scopeLabel);
    document.getElementById('srx-sub').textContent = sub.join('  ·  ');
    document.title = results.length + ' ' + mot(results.length) + ' — ' + scopeLabel + ' — Pullman';

    // ---- Tri : ni prix ni note pour une table, on trie par nom ou par hôtel ----
    const sortSel = document.getElementById('srx-sort');
    sortSel.innerHTML = '<option value="nom">Nom</option><option value="hotel">Hôtel</option>';

    // ---- Liste ----
    const listEl = document.getElementById('srx-list');
    let epingle = null;
    const trie = () => {
      const a = results.slice();
      if (sortSel.value === 'hotel') a.sort((x, y) => x.hotel.localeCompare(y.hotel) || x.nom.localeCompare(y.nom));
      else a.sort((x, y) => x.nom.localeCompare(y.nom));
      if (epingle) {
        // Les tables de l'hôtel désigné remontent ensemble : c'est lui qu'on a pointé.
        const dessus = a.filter(v => v.hotel === epingle), reste = a.filter(v => v.hotel !== epingle);
        return dessus.concat(reste);
      }
      return a;
    };
    const rendre = (items) => {
      if (!items.length) { vide(); return; }
      listEl.innerHTML = items.map(v => {
        const h = parNom.get(v.hotel) || {};
        const cles = window.WD_IMG_KEYS ? window.WD_IMG_KEYS(h) : [(h.img || 'aja_p_6783-26').split(':')[0]];
        const photo = (k) => D.imgBase + k + '?fmt=jpg&op_usm=1.75,0.3,2,0&wid=400';
        const badges = [v.type === 'bar' ? 'Bar' : 'Restaurant']
          .concat(v.cuisines.concat(v.tags).map(libelle)).slice(0, 4);
        return '<article class="srx-card" data-resto="' + esc(v.nom) + '" data-hotel="' + esc(v.hotel) + '">' +
          '<div class="srx-card-media"' + (cles.length > 1 ? ' data-galerie' : '') + '>' +
            cles.map((k, i) => '<img class="srx-card-img" src="' + photo(k) + '" alt="' + esc(v.nom) + '"' +
              (i === 0 ? ' data-on' : ' loading="lazy"') + '/>').join('') +
            (cles.length > 1
              ? '<button type="button" class="pullman-popup__nav pullman-popup__nav--prev" data-photo="-1" aria-label="Photo précédente"></button>' +
                '<button type="button" class="pullman-popup__nav pullman-popup__nav--next" data-photo="1" aria-label="Photo suivante"></button>' +
                '<div class="pullman-popup__points">' +
                  cles.map((k, i) => '<button type="button" class="pullman-popup__point" data-point="' + i + '"' +
                    (i === 0 ? ' data-on' : '') + ' aria-label="Photo ' + (i + 1) + ' sur ' + cles.length + '"></button>').join('') +
                '</div>'
              : '') +
          '</div>' +
          '<div class="srx-card-body">' +
            '<div class="srx-card-top"><div>' +
              '<h2 class="srx-card-name">' + esc(v.nom) + '</h2>' +
              '<p class="srx-card-loc">' + esc(v.hotel) + ' · ' + esc(v.ville) + '</p>' +
            '</div></div>' +
            '<div class="srx-badges">' + badges.map(b => '<span class="srx-badge">' + esc(b) + '</span>').join('') + '</div>' +
            '<div class="srx-card-bottom">' +
              '<span class="srx-actions">' +
                (h.href ? '<a class="srx-link" href="' + esc(h.href) + '" target="_blank" rel="noopener">Voir l’hôtel <span aria-hidden="true">→</span></a>' : '') +
                (v.url ? '<a class="srx-cta" href="' + esc(v.url) + '" target="_blank" rel="noopener">Voir la table</a>' : '') +
              '</span>' +
            '</div>' +
          '</div></article>';
      }).join('');
    };

    // ---- Zéro résultat : quel critère, retiré, débloque le plus de tables ? ----
    function vide() {
      let best = null;
      critIds.forEach(id => {
        const reduits = critIds.filter(x => x !== id);
        const m = lieux.filter(v => repond(v, reduits));
        if (m.length && (!best || m.length > best.count)) best = { id, label: libelle(id), count: m.length };
      });
      const sans = (id) => {
        const np = new URLSearchParams(location.search);
        const reste = critIds.filter(x => x !== id);
        if (id === null || !reste.length) np.delete('criteria'); else np.set('criteria', reste.join(','));
        return location.pathname + '?' + np.toString();
      };
      let inner = '<h2>Aucune table ne correspond à tous vos critères</h2>';
      if (best) {
        inner += '<p>En retirant <strong>« ' + esc(best.label) + ' »</strong>, <strong>' + best.count + ' ' + mot(best.count) +
          '</strong> correspondrai' + (best.count > 1 ? 'ent' : 't') + '.</p>' +
          '<div class="srx-empty-actions">' +
          '<button type="button" class="srx-empty-relax" onclick="location.href=\'' + sans(best.id) + '\'">Retirer « ' + esc(best.label) + ' »</button>' +
          '<button type="button" class="srx-empty-reset" onclick="location.href=\'' + sans(null) + '\'">Réinitialiser les critères</button></div>';
      } else {
        inner += '<p>Essayez d’élargir la destination ou de modifier vos critères dans la barre de recherche ci-dessus.</p>' +
          '<div class="srx-empty-actions"><button type="button" class="srx-empty-reset" onclick="location.href=\'' + sans(null) + '\'">Réinitialiser les critères</button></div>';
      }
      listEl.innerHTML = '<div class="srx-empty" role="status">' + inner + '</div>';
    }

    rendre(trie());
    sortSel.addEventListener('change', () => rendre(trie()));

    // ---- Carte : un pin par hôtel qui héberge une table retenue ----
    const hotels = [...new Set(results.map(v => v.hotel))].map(n => parNom.get(n)).filter(Boolean)
      .filter(h => h.lat !== null && h.lat !== undefined && h.lng !== null);
    const map = L.map(document.getElementById('srx-map'), { zoomControl: true, attributionControl: false, scrollWheelZoom: false });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);
    const pinParHotel = new Map();
    if (hotels.length) {
      const groupe = L.featureGroup(hotels.map(h => {
        const mk = L.marker([h.lat, h.lng], { icon: L.divIcon({ className: '', html: '<div class="srx-pin"></div>', iconSize: [12, 12], iconAnchor: [6, 6] }) });
        pinParHotel.set(h.name, mk);
        // Cliquer un pin remonte les tables de cet hôtel en tête de liste.
        mk.on('click', () => { epingle = h.name; rendre(trie()); marquer(h.name);
          const c = listEl.querySelector('.srx-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
        return mk;
      }));
      groupe.addTo(map);
      map.fitBounds(groupe.getBounds().pad(0.25), { maxZoom: 8 });
    } else {
      map.setView([25, 10], 2);
    }
    const marquer = (nom) => {
      pinParHotel.forEach(m => m._icon && m._icon.classList.remove('srx-pin-wrap--active'));
      const mk = pinParHotel.get(nom);
      if (mk && mk._icon) mk._icon.classList.add('srx-pin-wrap--active');
    };
    // Réciproque : survoler une card désigne son hôtel sur la carte.
    listEl.addEventListener('mouseover', (e) => {
      const c = e.target.closest('.srx-card');
      if (c) marquer(c.dataset.hotel);
    });
  }

  function init(D) {
    // ---- 1. Périmètre géographique (même sémantique que le dropdown) ----
    // D.hotels : liste canonique déjà à plat et géolocalisée (WD_HOTELS).
    const cont = P.get('continent');
    let pool, scopeLabel = '';
    if (cont && cont !== 'all') {
      const r = D.regions.find(r => r.id === cont);
      pool = D.hotels.filter(h => h.region === cont);
      scopeLabel = r ? r.label : '';
    } else {
      pool = D.hotels.slice();
      if (cont === 'all') scopeLabel = 'Tous les continents';
    }
    const country = P.get('country');
    if (country) { pool = pool.filter(h => h.country === country); scopeLabel = country; }
    const city = P.get('city');
    if (city) { pool = pool.filter(h => h.loc.split(',')[0].trim() === city); scopeLabel = city; }
    const hotelName = P.get('hotel');
    if (hotelName) { pool = pool.filter(h => h.name === hotelName); scopeLabel = hotelName; }
    const q = (P.get('q') || '').trim();
    if (q) {
      const lq = q.toLowerCase();
      pool = pool.filter(h => h.name.toLowerCase().includes(lq) || h.loc.toLowerCase().includes(lq));
      if (!scopeLabel) scopeLabel = '« ' + q + ' »';
    }
    if (!scopeLabel) scopeLabel = 'Toutes nos destinations';

    // ---- 2. Critères (même matching que le dropdown : mapping critère -> services) ----
    const critIds = (P.get('criteria') || '').split(',').filter(Boolean);
    const matches = (h, ids) => ids.every(id => {
      const svcs = D.criteriaToServices[id];
      if (!svcs || !svcs.length) return true;
      return h.services && svcs.some(s => h.services.includes(s));
    });
    let results = pool.filter(h => matches(h, critIds));

    const critList = (D.criteriaGroups.hotels || []).flatMap(g => g.items);
    const labelFor = (id) => (critList.find(c => c.id === id) || {}).label || id;

    // ---- 3. Prix / note / avis : déjà portés par la source (WD_HOTELS) ----
    // Ils étaient recalculés ici ; l'encart de la carte aurait alors pu afficher un
    // autre prix que la carte de résultats pour le même hôtel.

    // Un tarif n'a de sens qu'avec des dates ET une occupation : sans elles, le prix
    // affiché serait une promesse invérifiable. L'occupation a toujours une valeur
    // (1 personne, 1 chambre par défaut, toujours visible dans la barre) : ce sont donc
    // les dates qui décident. Si l'occupation devenait facultative, il faudrait
    // l'ajouter ici de la même façon.
    // Séjour par défaut si l'URL n'en porte pas : ce soir → demain, exactement comme la
    // barre de recherche. Sans ce repli, une URL sans dates affichait « Ajoutez vos
    // dates » alors que la barre juste au-dessus montrait déjà celles du jour.
    const iso = (d) => d.toISOString().slice(0, 10);
    const aujourdhui = new Date(); aujourdhui.setHours(12, 0, 0, 0);
    const lendemain = new Date(aujourdhui); lendemain.setDate(lendemain.getDate() + 1);
    const arrivee = P.get('checkin') || iso(aujourdhui);
    const depart = P.get('checkout') || iso(lendemain);
    const showPrice = true; // il y a toujours des dates, donc toujours un tarif à montrer

    // Séjour recherché, transmis au lien de réservation ALL pour que l'utilisateur
    // n'ait pas à ressaisir ses dates en arrivant sur le moteur.
    const nuits = Math.max(1, Math.round((new Date(depart) - new Date(arrivee)) / 86400000));
    const stay = {
      checkin: arrivee,
      nights: nuits,
      guests: Math.max(1, parseInt(P.get('adults'), 10) || 1) + Math.max(0, parseInt(P.get('children'), 10) || 0)
    };
    const bookingUrl = (h) => (window.WD_ALL_BOOKING_URL ? window.WD_ALL_BOOKING_URL(h, stay) : null);

    const SERVICE_LABELS = {
      pool: 'Piscine', spa: 'Spa', gym: 'Fitness', beach: 'Bord de mer',
      breakfast: 'Petit-déjeuner', restaurant: 'Restaurant', bar: 'Bar', rooftop: 'Rooftop',
      parking: 'Parking', pets: 'Animaux acceptés', 'kids-club': 'Kids club',
      'meeting-rooms': 'Salles de réunion', coworking: 'Coworking', garden: 'Jardin',
      golf: 'Golf', casino: 'Casino', 'airport-shuttle': 'Navette aéroport', wifi: 'Wi-Fi'
    };
    // Rareté d'un service dans le catalogue : plus il est rare, plus il distingue.
    // Bar, petit-déjeuner, restaurant et wifi sont sur 100 % des hôtels — ils ne
    // méritent jamais un badge.
    const RARETE = (() => {
      const f = {};
      D.hotels.forEach(h => (h.services || []).forEach(s => { f[s] = (f[s] || 0) + 1; }));
      return f;
    })();
    // Seuil à 70 % : au-delà, un service se retrouve sur presque toutes les cards et
    // n'aide plus à choisir. Écarte bar, petit-déjeuner, restaurant, wifi (100 %),
    // fitness (98 %), parking (85 %), salles de réunion (84 %) et piscine (73 %).
    const SERVICES_UNIVERSELS = Object.keys(RARETE).filter(s => RARETE[s] / D.hotels.length > 0.7);
    // Les services déjà filtrés sont communs à tous les résultats : on les écarte aussi.
    const SERVICES_FILTRES = new Set(critIds.flatMap(id => D.criteriaToServices[id] || []));
    const servicesDistinctifs = (h) => (h.services || [])
      .filter(s => !SERVICES_UNIVERSELS.includes(s) && !SERVICES_FILTRES.has(s) && SERVICE_LABELS[s])
      .sort((a, b) => RARETE[a] - RARETE[b])
      .slice(0, 3);

    // ---- 4. En-tête ----
    const fmtDay = (iso) => new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' }).format(new Date(iso + 'T12:00:00'));
    const subParts = [];
    if (critIds.length) subParts.push(critIds.map(labelFor).join(', '));
    // On affiche le séjour effectif, celui de l'URL ou celui par défaut — jamais rien.
    subParts.push(fmtDay(arrivee) + ' – ' + fmtDay(depart) + (P.get('flex') ? ' · ±' + P.get('flex') + 'j' : ''));
    // Occupation : mêmes bornes que le panneau voyageurs (7 chambres, 1-9 adultes et 0-6 enfants
    // par chambre). Sans ce bornage, une URL bricolée afficherait ici « 99 adultes » alors que la
    // barre de recherche, elle, plafonne à 9 — deux chiffres différents pour la même recherche.
    const GP = { rooms: 7, adults: 9, children: 6 };
    const plural = (n, s) => n + ' ' + s + (n > 1 ? 's' : '');
    const nRooms = Math.min(GP.rooms, Math.max(1, parseInt(P.get('rooms'), 10) || 1));
    const nAdults = Math.min(nRooms * GP.adults, Math.max(nRooms, parseInt(P.get('adults'), 10) || 1));
    const nChildren = Math.min(nRooms * GP.children, Math.max(0, parseInt(P.get('children'), 10) || 0));
    subParts.push(((nAdults === 1 && !nChildren) ? '1 personne'
      : [plural(nAdults, 'adulte'), nChildren ? plural(nChildren, 'enfant') : null].filter(Boolean).join(', '))
      + ', ' + plural(nRooms, 'chambre'));
    document.getElementById('srx-title').innerHTML = '<strong>' + results.length + '</strong> hôtel' + (results.length > 1 ? 's' : '') + ' — ' + esc(scopeLabel);
    document.getElementById('srx-sub').textContent = subParts.join('  ·  ');
    document.title = results.length + ' hôtel' + (results.length > 1 ? 's' : '') + ' — ' + scopeLabel + ' — Pullman';

    // ---- 5. Liste ----
    const listEl = document.getElementById('srx-list');
    const renderList = (items) => {
      if (!items.length) { renderEmpty(); return; }
      listEl.innerHTML = items.map(h => {
        // Clé nue, sans suffixe de ratio : toutes les photos n'ont pas de rendu « :1by1 »
        // côté Accor. Le cadrage 4:3 est porté par .srx-card-img (aspect-ratio + cover).
        const imgKey = window.WD_IMG_KEY ? window.WD_IMG_KEY(h) : (h.img || 'aja_p_6783-26').split(':')[0];
        // Les photos de l'hôtel, relevées sur sa fiche. La principale reste en tête, donc
        // la liste s'ouvre exactement comme avant ; les suivantes se découvrent au clic.
        const cles = window.WD_IMG_KEYS ? window.WD_IMG_KEYS(h) : [imgKey];
        const photo = (k) => D.imgBase + k + '?fmt=jpg&op_usm=1.75,0.3,2,0&wid=400';
        // On n'affiche PAS les critères filtrés : en correspondance ET, tous les résultats
        // les satisfont, donc le même badge apparaîtrait sur chaque card sans rien
        // distinguer. On montre à la place les services les plus rares de cet hôtel —
        // ceux qui aident réellement à comparer deux lignes de la liste.
        const badges = servicesDistinctifs(h)
          .map(s => '<span class="srx-badge">' + esc(SERVICE_LABELS[s] || s) + '</span>').join('');
        // tabindex + role : la card est cliquable (elle recentre la carte), elle doit
        // donc être atteignable au clavier comme n'importe quel contrôle.
        return '<article class="srx-card" data-hotel="' + esc(h.name) + '" tabindex="0" role="button" aria-label="' + esc(h.name) + ' — voir sur la carte">' +
          // Largeur seule, sans « hei » : beaucoup de photos Accor sont en portrait, et
          // imposer une hauteur fait remplir le cadre de BLANC par le serveur. On récupère
          // la photo dans son ratio d'origine et c'est object-fit qui recadre.
          '<div class="srx-card-media"' + (cles.length > 1 ? ' data-galerie' : '') + '>' +
            cles.map((k, i) =>
              '<img class="srx-card-img" src="' + photo(k) + '" alt="' + esc(h.name) + '"' +
              (i === 0 ? ' data-on' : ' loading="lazy"') + '/>').join('') +
            (cles.length > 1
              ? '<button type="button" class="pullman-popup__nav pullman-popup__nav--prev" data-photo="-1" aria-label="Photo précédente"></button>' +
                '<button type="button" class="pullman-popup__nav pullman-popup__nav--next" data-photo="1" aria-label="Photo suivante"></button>' +
                '<div class="pullman-popup__points">' +
                  cles.map((k, i) => '<button type="button" class="pullman-popup__point" data-point="' + i + '"' +
                    (i === 0 ? ' data-on' : '') + ' aria-label="Photo ' + (i + 1) + ' sur ' + cles.length + '"></button>').join('') +
                '</div>'
              : '') +
          '</div>' +
          '<div class="srx-card-body">' +
            '<div class="srx-card-top"><div>' +
              '<h3 class="srx-card-name">' + esc(h.name) + '</h3>' +
              '<p class="srx-card-loc">' + esc(h.loc) + '</p>' +
            '</div>' +
            '<div class="srx-card-rating"><b>' + h.rating + '</b><span>' + h.reviews + ' avis</span></div></div>' +
            // Rendu même vide : c'est lui qui réserve la hauteur et aligne les cards
            '<div class="srx-badges">' + badges + '</div>' +
            '<div class="srx-card-bottom">' +
              '<span class="srx-price"><b>' + h.price + ' €</b> <span>/ nuit</span></span>' +
              // Deux destinations : la fiche sur le site de marque, la réservation sur ALL.
              // « Réserver » en dernier, donc à droite : l'action principale occupe la
              // position terminale du regard. Même ordre que l'encart de la carte.
              '<span class="srx-actions">' +
                (h.href ? '<a class="srx-link" href="' + esc(h.href) + '" target="_blank" rel="noopener">Voir l’hôtel <span aria-hidden="true">→</span></a>' : '') +
                (bookingUrl(h) ? '<a class="srx-cta" href="' + esc(bookingUrl(h)) + '" target="_blank" rel="noopener">Réserver</a>' : '') +
              '</span>' +
            '</div>' +
          '</div></article>';
      }).join('');
    };

    // ---- 6. Zéro résultat : suggestion de relâchement (même logique que le dropdown) ----
    function renderEmpty() {
      let best = null;
      critIds.forEach(id => {
        const reduced = critIds.filter(x => x !== id);
        const m = pool.filter(h => matches(h, reduced));
        if (m.length && (!best || m.length > best.count)) best = { id, label: labelFor(id), count: m.length };
      });
      const urlWithout = (removeId) => {
        const np = new URLSearchParams(location.search);
        const rest = critIds.filter(x => x !== removeId);
        if (removeId === null || !rest.length) np.delete('criteria'); else np.set('criteria', rest.join(','));
        return location.pathname + '?' + np.toString();
      };
      let inner = '<h2>Aucun hôtel ne correspond à tous vos critères</h2>';
      if (best) {
        inner += '<p>En retirant <strong>« ' + esc(best.label) + ' »</strong>, <strong>' + best.count + ' hôtel' + (best.count > 1 ? 's' : '') + '</strong> correspond' + (best.count > 1 ? 'raient' : 'rait') + '.</p>' +
          '<div class="srx-empty-actions">' +
          '<button type="button" class="srx-empty-relax" onclick="location.href=\'' + urlWithout(best.id) + '\'">Retirer « ' + esc(best.label) + ' »</button>' +
          '<button type="button" class="srx-empty-reset" onclick="location.href=\'' + urlWithout(null) + '\'">Réinitialiser les critères</button></div>';
      } else {
        inner += '<p>Essayez d’élargir la destination ou de modifier vos critères dans la barre de recherche ci-dessus.</p>' +
          '<div class="srx-empty-actions"><button type="button" class="srx-empty-reset" onclick="location.href=\'' + urlWithout(null) + '\'">Réinitialiser les critères</button></div>';
      }
      listEl.innerHTML = '<div class="srx-empty" role="status">' + inner + '</div>';
    }

    // ---- 7. Tri ----
    const sortSel = document.getElementById('srx-sort');
    // Le tri par prix reste toujours actif : depuis que le séjour a une valeur par
    // défaut, il y a toujours un tarif affiché.
    // Hôtel remonté en tête après un clic sur son pin. Il ne remplace pas le tri : il
    // s'y ajoute, pour qu'on retrouve l'hôtel désigné sans perdre l'ordre choisi.
    let epingle = null;
    const sorted = () => {
      const mode = sortSel.value;
      const arr = results.slice();
      if (mode === 'prix') arr.sort((a, b) => a.price - b.price);
      else if (mode === 'note') arr.sort((a, b) => b.rating - a.rating);
      if (epingle) {
        const i = arr.findIndex(h => h.name === epingle);
        if (i > 0) arr.unshift(arr.splice(i, 1)[0]);
      }
      return arr;
    };
    sortSel.addEventListener('change', () => renderList(sorted()));

    // ---- 8. Carte ----
    const mapEl = document.getElementById('srx-map');
    // Les coordonnées viennent de la source unique : position réelle de l'hôtel quand elle
    // est connue, sinon centre-ville décalé. Remplace le repli au centre du PAYS, qui
    // déplaçait certains pins de plus de cent kilomètres.
    const coords = results
      .filter(h => h.lat !== null && h.lat !== undefined && h.lng !== null)
      .map(h => ({ h, ll: [h.lat, h.lng] }));

    const map = L.map(mapEl, { zoomControl: true, attributionControl: false, scrollWheelZoom: false });
    // Esri Dark Gray : gratuit sans clé (les tuiles CARTO sont désormais filigranées « API key required »)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);
    // Marqueurs indexés par nom : c'est ce qui permet de relier une card à son pin.
    const markerByHotel = new Map();
    if (coords.length) {
      // Pas de bulle sur cette carte : cliquer un pin remonte déjà la card en tête de
      // liste, à gauche. Une bulle répéterait la même information tout en masquant le
      // pin. Ici la liste est le support de lecture, la carte sert à situer.
      const group = L.featureGroup(coords.map(({ h, ll }) => {
        const mk = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="srx-pin"></div>', iconSize: [12, 12], iconAnchor: [6, 6] }) });
        markerByHotel.set(h.name, mk);
        return mk;
      }));
      group.addTo(map);
      map.fitBounds(group.getBounds().pad(0.25), { maxZoom: 8 });
    } else {
      map.setView([25, 10], 2);
    }

    // ---- 9. Liaison liste ↔ carte ----
    // Sans bulle, c'est le pin lui-même qui doit dire lequel on regarde.
    const marquerPin = (name) => {
      markerByHotel.forEach((m) => m._icon && m._icon.classList.remove('srx-pin-wrap--active'));
      const mk = markerByHotel.get(name);
      if (mk && mk._icon) mk._icon.classList.add('srx-pin-wrap--active');
    };
    // Cliquer une card recentre la carte sur l'hôtel. Le zoom n'est relevé que s'il est
    // faible : quelqu'un qui a déjà zoomé garde son échelle.
    const focusHotel = (name) => {
      const mk = markerByHotel.get(name);
      if (!mk) return;
      listEl.querySelectorAll('.srx-card--active').forEach(c => c.classList.remove('srx-card--active'));
      const card = listEl.querySelector('[data-hotel="' + (window.CSS && CSS.escape ? CSS.escape(name) : name) + '"]');
      if (card) card.classList.add('srx-card--active');
      marquerPin(name);
      map.flyTo(mk.getLatLng(), Math.max(map.getZoom(), 11), { duration: .6 });
    };
    listEl.addEventListener('click', (e) => {
      // On ne détourne pas les liens de la card (« Voir l'hôtel »)
      if (e.target.closest('a')) return;
      const card = e.target.closest('.srx-card');
      if (card && card.dataset.hotel) focusHotel(card.dataset.hotel);
    });
    // Clavier : les cards sont focusables, Entrée/Espace déclenche le même recentrage
    listEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const card = e.target.closest('.srx-card');
      if (card && card.dataset.hotel) { e.preventDefault(); focusHotel(card.dataset.hotel); }
    });
    // Réciproque : cliquer un pin remonte sa card en tête de liste et ramène la vue en
    // haut. Faire défiler jusqu'à une card perdue au 80e rang aurait sorti la barre de
    // recherche de l'écran ; la remonter en premier évite le défilement et garde le
    // contexte de recherche visible, prêt à être ajusté.
    markerByHotel.forEach((mk, name) => mk.on('click', () => {
      epingle = name;
      renderList(sorted());
      const card = listEl.querySelector('[data-hotel="' + (window.CSS && CSS.escape ? CSS.escape(name) : name) + '"]');
      if (card) card.classList.add('srx-card--active');
      marquerPin(name);
      const barre = document.querySelector('wd-booking');
      const cible = barre ? window.scrollY + barre.getBoundingClientRect().top - 12 : 0;
      window.scrollTo({ top: Math.max(0, cible), behavior: 'smooth' });
    }));

    renderList(sorted());
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => ready(30));
  else ready(30);
})();
</script>

</body>
</html>
