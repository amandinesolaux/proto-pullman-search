<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Carousel Modal</title>
  <link rel="stylesheet" href="core/styles/discovery-modal.css"/>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .test-container {
      text-align: center;
    }
    .test-btn {
      padding: 16px 32px;
      background: #445047;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      font-weight: 600;
    }
    .test-btn:hover {
      background: #556158;
    }
    .info {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
  <script src="core/components/components.js"></script>
</head>
<body>

  <div class="test-container">
    <h1 style="color: #445047; margin-bottom: 24px;">Test Discovery Modal Carousel</h1>
    <button class="test-btn" onclick="document.querySelector('wd-discovery-modal').open()">
      ✨ Ouvrir le Carousel
    </button>
    <div class="info">
      Navigation : Flèches ← →, molette horizontale, ou clic sur les cartes
    </div>
  </div>

  <wd-discovery-modal></wd-discovery-modal>

</body>
</html>
