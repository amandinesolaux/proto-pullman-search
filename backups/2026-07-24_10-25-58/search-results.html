  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── HEADER ── */
    .sr-header { background: var(--pul-olive, #445047); padding: 0; flex-shrink: 0; }

    .sr-header-links a:hover { color: #fff; }

    /* ── BOOKING BAR ── */
    .sr-booking { display: flex; align-items: stretch; gap: 0; background: var(--pul-bg, #28332B); padding: 10px 24px; border-bottom: 1px solid rgba(255,255,255,.08); }

    .sr-booking-cta { display: flex; align-items: center; justify-content: center; background: var(--pul-highlight, #5FEF91); color: var(--pul-olive, #445047); border: none; padding: 0 24px; border-radius: 0 8px 8px 0; font-family: inherit; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; cursor: pointer; transition: opacity .15s; white-space: nowrap; gap: 6px; }

    /* ── FILTERS ── */

    .sr-filter { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; font-weight: 500; color: #444; background: #fff; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .sr-filter:hover { background: rgba(95,239,145,.08); border-color: rgba(95,239,145,.25); color: #222; }
    .sr-filter--active { background: #5fef91; color: #1a2b1e; border-color: #5fef91; font-weight: 600; }
    .sr-filter svg { width: 14px; height: 14px; }
    .sr-filter-clear { display: none; padding: 6px 14px; border-radius: 4px; background: transparent; border: 1px dashed rgba(95,239,145,.4); font-size: 12px; font-weight: 500; color: #2a7a47; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .sr-filter-clear:hover { background: rgba(95,239,145,.08); border-color: rgba(95,239,145,.6); }
    .sr-sort { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #717171; cursor: pointer; white-space: nowrap; }
    .sr-sort select { border: none; background: transparent; font-size: 12px; font-weight: 600; color: #222; font-family: inherit; cursor: pointer; outline: none; }

    /* ── LAYOUT ── */
    .sr { display: flex; flex-direction: column; height: 100vh; }
    .sr-body { display: flex; flex: 1; min-height: 0; }

    /* ── LEFT PANEL ── */
    .sr-panel { width: 52%; display: flex; flex-direction: column; border-right: 1px solid #e0e0e0; background: #fff; }
    .sr-sub { display: flex; align-items: center; justify-content: space-between; padding: 10px 24px; border-bottom: 1px solid #ebebeb; flex-shrink: 0; }

    .sr-card-carousel-btn--prev { left: 6px; }
    .sr-card-carousel-btn--next { right: 6px; }
    .sr-card-carousel-dots { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; z-index: 2; }
    .sr-card-carousel-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.5); transition: background .2s; }
    .sr-card-carousel-dot--active { background: #fff; }
    .sr-card-body { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 2px 0; }
    .sr-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 2px; }
    .sr-card-name { font-size: 15px; color: #222; font-weight: 600; line-height: 1.3; }
    .sr-card-stars { color: var(--pul-olive, #445047); font-size: 11px; letter-spacing: 1px; flex-shrink: 0; }
    .sr-card-loc { font-size: 13px; color: #717171; margin-bottom: 4px; }
    .sr-card-badge { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; background: var(--pul-olive, #445047); color: #fff; padding: 2px 7px; border-radius: 4px; margin-bottom: 4px; width: fit-content; }
    .sr-card-features { font-size: 12px; color: #999; line-height: 1.5; margin-top: auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .sr-card-bottom { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; margin-top: 8px; }
    .sr-card-price { font-size: 16px; font-weight: 700; color: #222; }

  var THEME_LABELS = { wellness: "Bien-être & spa", gastro: "Gastronomie", family: "En famille", business: "Business", romance: "Romantique", culture: "Culture", eco: "Éco-responsable", meeting: "Séminaire", beach: "Plage", luxury: "Luxe" };

  var params = new URLSearchParams(window.location.search);
  var query = params.get('q') || params.get('dest') || '';
  var theme = params.get('theme') || '';
  var inputEl = document.getElementById('sr-query');
  inputEl.value = query;

  var normalize = function(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); };

  var KEYWORD_TO_TAG = {piscine:'beach',spa:'wellness',detente:'wellness',romantique:'romance',famille:'family',business:'business',gastronomie:'gastro',restaurant:'gastro',culture:'culture',plage:'beach',rooftop:'luxury',luxe:'luxury'};

  var FILTER_CONFIG = {
    spa:        { tags:['wellness'], keywords:['spa','bien-être','wellness'] },
    pool:       { tags:['beach'],    keywords:['piscine','pool'] },
    restaurant: { tags:['gastro'],   keywords:['restaurant','gastronomique','gastronomie'] },
    rooftop:    { tags:['luxury'],   keywords:['rooftop','sky bar','bar'] },
    beach:      { tags:['beach'],    keywords:['mer','plage','beach','front de mer'] },
    business:   { tags:['business','meeting'], keywords:['business','center','séminaire','meeting'] }
  };
  var activeFilters = [];

  function filterHotels(q, t) {
    var results = ALL_HOTELS.slice();
    if (t) results = results.filter(function(h) { return h.tags && h.tags.indexOf(t) >= 0; });
    if (q && q.trim()) {
      var ql = normalize(q);
      var matchedTag = null;
      Object.keys(KEYWORD_TO_TAG).forEach(function(kw) { if (ql.includes(kw)) matchedTag = KEYWORD_TO_TAG[kw]; });
      results = results.filter(function(h) {
        if (normalize(h.name).includes(ql) || normalize(h.loc).includes(ql)) return true;
        if (normalize(h.features || '').includes(ql)) return true;
        if (matchedTag && h.tags && h.tags.indexOf(matchedTag) >= 0) return true;
        var words = ql.split(/\s+/);
        for (var i = 0; i < words.length; i++) {
          if (words[i].length < 3) continue;
          if (normalize(h.features || '').includes(words[i])) return true;
          var wTag = KEYWORD_TO_TAG[words[i]];
          if (wTag && h.tags && h.tags.indexOf(wTag) >= 0) return true;
        }
        return false;
      });
    }
    // Apply category filters
    if (activeFilters.length) {
      results = results.filter(function(h) {
        return activeFilters.every(function(f) {
          var cfg = FILTER_CONFIG[f];
          if (!cfg) return true;
          var hasTag = cfg.tags.some(function(tag) { return h.tags && h.tags.indexOf(tag) >= 0; });
          var hasKw = cfg.keywords.some(function(kw) { return normalize(h.features || '').includes(kw); });
          return hasTag || hasKw;
        });
      });
    }
    return results;
  }

  function highlightFeatures(featuresStr) {
    if (!activeFilters.length || !featuresStr) return featuresStr;
    var parts = featuresStr.split(' · ');
    return parts.map(function(part) {
      var norm = normalize(part);
      var match = activeFilters.some(function(f) {
        var cfg = FILTER_CONFIG[f];
        return cfg && cfg.keywords.some(function(kw) { return norm.includes(normalize(kw)); });
      });
      return match ? '<strong>' + part + '</strong>' : part;
    }).join(' · ');
  }

  function sortHotels(list, key) {
    var sorted = list.slice();
    if (key === 'price-asc') sorted.sort(function(a,b) { return a.price - b.price; });
    else if (key === 'price-desc') sorted.sort(function(a,b) { return b.price - a.price; });
    else if (key === 'stars') sorted.sort(function(a,b) { return b.stars - a.stars || b.rating - a.rating; });
    return sorted;
  }

  function createMarkerIcon(price, active) {
    return L.divIcon({

      html: '<div class="sr-marker' + (active ? ' sr-marker--active' : '') + '">' + price + ' €</div>',
      iconSize: null,
      iconAnchor: [30, 15],
      popupAnchor: [0, -18]
    });
  }

  function setActive(idx) {
    if (activeIdx === idx) return;
    if (activeIdx >= 0 && markers[activeIdx]) {
      markers[activeIdx].setIcon(createMarkerIcon(markers[activeIdx]._price, false));
      var prev = document.querySelector('.sr-card[data-idx="' + activeIdx + '"]');
      if (prev) prev.classList.remove('sr-card--active');
    }
    activeIdx = idx;
    if (idx >= 0 && markers[idx]) {
      markers[idx].setIcon(createMarkerIcon(markers[idx]._price, true));
      var card = document.querySelector('.sr-card[data-idx="' + idx + '"]');
      if (card) { card.classList.add('sr-card--active'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    }
  }

  function clearActive() {
    if (activeIdx >= 0) {
      if (markers[activeIdx]) markers[activeIdx].setIcon(createMarkerIcon(markers[activeIdx]._price, false));
      var prev = document.querySelector('.sr-card[data-idx="' + activeIdx + '"]');
      if (prev) prev.classList.remove('sr-card--active');
      activeIdx = -1;
    }
  }

  function render(hotels) {
    var listEl = document.getElementById('sr-list');
    var metaEl = document.getElementById('sr-meta');
    var label = '';

    metaEl.textContent = hotels.length + ' hôtel' + (hotels.length > 1 ? 's' : '') + (label ? ' · ' + label : '');

    markers.forEach(function(m) { map.removeLayer(m); });
    markers = [];

    lockedIdx = -1;

    currentHotels = hotels;

    if (!hotels.length) {

          (imgs.length > 1 ? '<button class="sr-card-carousel-btn sr-card-carousel-btn--prev" type="button">&lsaquo;</button><button class="sr-card-carousel-btn sr-card-carousel-btn--next" type="button">&rsaquo;</button>' : '') +

          (h.features ? '<span class="sr-card-features">' + highlightFeatures(h.features) + '</span>' : '') +
          '<div class="sr-card-bottom">' +
            '<div><span class="sr-card-price">' + h.price + ' €</span> <span class="sr-card-price-unit">/ nuit</span></div>' +
            (h.rating ? '<div class="sr-card-rating"><span class="sr-card-rating-score">' + h.rating.toFixed(1) + '</span><span class="sr-card-rating-label">(' + h.reviews + ' avis)</span></div>' : '') +
          '</div>' +
          '<a class="sr-card-cta" href="' + detailHref + '">Voir la fiche &rarr;</a>' +
        '</div>' +
      '</div>';
    }).join('');

    hotels.forEach(function(h, i) {
      var marker = L.marker([h.lat, h.lng], { icon: createMarkerIcon(h.price, false) }).addTo(map);
      marker._price = h.price;

      var popImgs = h.imgs || [h.img];
      var popDotsHtml = popImgs.length > 1 ? '<div class="sr-popup-carousel-dots">' + popImgs.map(function(_, di) { return '<span class="sr-popup-carousel-dot' + (di === 0 ? ' sr-popup-carousel-dot--active' : '') + '"></span>'; }).join('') + '</div>' : '';
      marker.bindPopup(
        '<div class="sr-popup">' +
          '<div class="sr-popup-carousel" data-imgs=\'' + JSON.stringify(popImgs) + '\' data-ci="0">' +
            '<img src="' + popImgs[0] + '" alt="' + h.name + '"/>' +
            '<button class="sr-popup-fav" type="button"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>' +
            (popImgs.length > 1 ? '<button class="sr-popup-carousel-btn sr-popup-carousel-btn--prev" type="button">&lsaquo;</button><button class="sr-popup-carousel-btn sr-popup-carousel-btn--next" type="button">&rsaquo;</button>' : '') +
            popDotsHtml +
          '</div>' +
          '<div class="sr-popup-body">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
              '<span class="sr-popup-name">' + h.name + '</span>' +
              (h.rating ? '<span style="font-size:12px;font-weight:700">&#9733; ' + h.rating.toFixed(1) + ' <span style="font-weight:400;color:#717171">(' + h.reviews + ')</span></span>' : '') +
            '</div>' +
            '<span class="sr-popup-loc">' + h.loc + '</span>' +
            (h.features ? '<span style="font-size:11px;color:#999;margin:2px 0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden">' + h.features + '</span>' : '') +
            '<span class="sr-popup-price">' + h.price + ' € <span>/ nuit</span></span>' +
          '</div>' +
        '</div>',
        { closeButton: false, maxWidth: 280, minWidth: 260, offset: [0, -5], className: 'sr-popup-wrap' }
      );

      marker.on('mouseover', function() {
        setActive(i);
      });
      marker.on('mouseout', function() {
        if (lockedIdx < 0) { clearActive(); }
      });
      marker.on('click', function() {
        if (lockedIdx === i) { lockedIdx = -1; hidePOIs(); clearActive(); if (globalBounds) map.fitBounds(globalBounds, {animate:true, maxZoom: 13}); }
        else { lockedIdx = i; setActive(i); centerOnHotel(h.lat, h.lng); showPOIs(i); markers[i].openPopup(); }
      });
      markers.push(marker);
    });

    if (hotels.length) {
      globalBounds = L.featureGroup(markers).getBounds().pad(0.3);
      map.fitBounds(globalBounds, { maxZoom: 13 });
    }

    listEl.querySelectorAll('.sr-card').forEach(function(card) {
      var idx = parseInt(card.dataset.idx);
      card.addEventListener('mouseenter', function() {
        setActive(idx);
      });
      card.addEventListener('mouseleave', function() {
        if (lockedIdx < 0) { clearActive(); }
      });
      card.addEventListener('click', function(e) {
        if (e.target.closest('.sr-card-carousel-btn') || e.target.closest('.sr-card-cta')) return;
        if (lockedIdx === idx) { lockedIdx = -1; hidePOIs(); clearActive(); if (globalBounds) map.fitBounds(globalBounds, {animate:true, maxZoom: 13}); }
        else { lockedIdx = idx; setActive(idx); centerOnHotel(hotels[idx].lat, hotels[idx].lng); showPOIs(idx); if (markers[idx]) markers[idx].openPopup(); }
      });
      card.querySelectorAll('.sr-card-carousel-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var carousel = btn.closest('.sr-card-carousel');
          var imgs = JSON.parse(carousel.dataset.imgs);
          var ci = parseInt(carousel.dataset.ci) || 0;
          if (btn.classList.contains('sr-card-carousel-btn--next')) { ci = (ci + 1) % imgs.length; }
          else { ci = (ci - 1 + imgs.length) % imgs.length; }
          carousel.dataset.ci = ci;
          carousel.querySelector('.sr-card-img').src = imgs[ci];
          var dots = carousel.querySelectorAll('.sr-card-carousel-dot');
          dots.forEach(function(d, di) { d.classList.toggle('sr-card-carousel-dot--active', di === ci); });
        });
      });
    });
  }

  var currentSort = 'relevance';
  function refresh() {
    var filtered = filterHotels(inputEl.value, theme);
    render(sortHotels(filtered, currentSort));
  }

  refresh();

  inputEl.addEventListener('input', function() {
    query = inputEl.value;
    refresh();
  });

  document.getElementById('sr-sort').addEventListener('change', function(e) {
    currentSort = e.target.value;
    refresh();
  });

  document.getElementById('sr-search-btn').addEventListener('click', function() {
    query = inputEl.value;
    refresh();
  });

  /* Auto-activate filter from theme param */
  var THEME_TO_FILTER = { wellness:'spa', gastro:'restaurant', beach:'beach', business:'business', romance:null, family:null, culture:null, luxury:'rooftop', meeting:'business' };
  if (theme && THEME_TO_FILTER[theme]) {
    var autoFilter = THEME_TO_FILTER[theme];
    if (activeFilters.indexOf(autoFilter) < 0) {
      activeFilters.push(autoFilter);
      var autoBtn = document.querySelector('[data-filter="' + autoFilter + '"]');
      if (autoBtn) autoBtn.classList.add('sr-filter--active');
    }
  }

  /* Auto-activate filters from tags param (passed from booking engine) */
  var TAG_TO_FILTER = {
    'Spa':'spa', 'Piscine':'pool', 'Hammam':'spa', 'Massage':'spa', 'Bien-etre':'spa',
    'Restaurant':'restaurant', 'Bar':'rooftop', 'Rooftop':'rooftop', 'Brunch':'restaurant',
    'Cave a vins':'restaurant', 'Plage':'beach', 'Business center':'business',
    'Coworking':'business', 'Salle de reunion':'business', 'Wi-Fi haut debit':'business',
    'Kids club':'pool', 'Suite familiale':'spa', 'Vue panoramique':'rooftop'
  };
  var tagsParam = params.get('tags');
  if (tagsParam) {
    tagsParam.split(',').forEach(function(rawTag) {
      var tag = decodeURIComponent(rawTag.trim());
      var mapped = TAG_TO_FILTER[tag];
      if (mapped && activeFilters.indexOf(mapped) < 0) {
        activeFilters.push(mapped);
        var btn = document.querySelector('[data-filter="' + mapped + '"]');
        if (btn) btn.classList.add('sr-filter--active');
      }
    });
  }

  /* Clear button visibility */
  var clearEl = document.getElementById('sr-clear-filters');
  function updateClearBtn() {
    if (clearEl) clearEl.style.display = activeFilters.length ? 'inline-flex' : 'none';
  }
  updateClearBtn();

  /* Filter chips toggle */
  document.querySelectorAll('.sr-filter').forEach(function(btn) {
    var f = btn.dataset.filter;
    if (f === 'all') {
      btn.addEventListener('click', function() {
        activeFilters = [];
        document.querySelectorAll('.sr-filter--active').forEach(function(b) { b.classList.remove('sr-filter--active'); });
        updateClearBtn();
        refresh();
      });
      return;
    }
    btn.addEventListener('click', function() {
      btn.classList.toggle('sr-filter--active');
      var idx = activeFilters.indexOf(f);
      if (idx >= 0) activeFilters.splice(idx, 1);
      else activeFilters.push(f);
      updateClearBtn();
      refresh();
    });
  });

  /* Clear all filters button */
  if (clearEl) {
    clearEl.addEventListener('click', function() {
      activeFilters = [];
      document.querySelectorAll('.sr-filter--active').forEach(function(b) { b.classList.remove('sr-filter--active'); });
      updateClearBtn();
      refresh();
    });
  }

  /* Popup carousel delegation (popups are injected dynamically) */
  document.getElementById('sr-map').addEventListener('click', function(e) {
    var btn = e.target.closest('.sr-popup-carousel-btn');
    if (!btn) return;
    e.stopPropagation();
    var carousel = btn.closest('.sr-popup-carousel');
    var imgs = JSON.parse(carousel.dataset.imgs);
    var ci = parseInt(carousel.dataset.ci) || 0;
    if (btn.classList.contains('sr-popup-carousel-btn--next')) { ci = (ci + 1) % imgs.length; }
    else { ci = (ci - 1 + imgs.length) % imgs.length; }
    carousel.dataset.ci = ci;
    carousel.querySelector('img').src = imgs[ci];
    var dots = carousel.querySelectorAll('.sr-popup-carousel-dot');
    dots.forEach(function(d, di) { d.classList.toggle('sr-popup-carousel-dot--active', di === ci); });
  });
})();
</script>
</body>
</html>
